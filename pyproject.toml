[project]
name = "rocom-parse-scripts"
version = "0"
description = "解包后处理与代码生成脚本(bin2json / gen_*:解包目录 → names.json、图标 webp、Go 结构体、pcapdump 描述符)"
# >=3.10 + pillow 钉死精确版本: 确保所有人解析到同一 libwebp,webp 转码字节可复现
# (libwebp 版本一变会导致全量图片 diff,见 docs/data.md)。
requires-python = ">=3.10"
# protobuf: gen_proto/gen_gamedata/gen_pbdesc 读 all.pb 描述符;pillow: gen_images/gen_icons/gen_bigmap 转 webp。
# bin2json.py 为纯标准库,不在此列。
dependencies = ["protobuf>=5,<7", "pillow==12.2.0"]

[tool.uv]
package = false
